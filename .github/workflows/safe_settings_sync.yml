# Workflow to apply safe-settings org configuration.
# Runs daily to reconcile settings and on manual dispatch.
# Uses a dedicated safe-settings-bot GitHub App for authentication.
#
# safe-settings reads config from the admin repo's default branch (main).
# Config must be merged to main before this workflow can apply it.
#
# See MAINTAINING.md for operational documentation.
name: Safe Settings Sync

"on":
  schedule:
    # Daily at 07:00 UTC — after peribolos apply (05:30 UTC, ~40 min)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Preview changes without applying (NOP mode)'
        required: false
        type: boolean
        default: true
      repos:
        description: >-
          Comma-separated list of repos to target (e.g. "complytime-demos").
          Leave empty to apply to all managed repos.
        required: false
        type: string
        default: ''
      version:
        description: >-
          safe-settings commit SHA or tag. Leave empty to use the
          default version (see SAFE_SETTINGS_DEFAULT_VERSION env).
        required: false
        type: string
        default: '594f3c706de6c4ddafb1a86dfa7468f19337e54f'

permissions:
  contents: none

concurrency:
  group: safe-settings-sync
  cancel-in-progress: false

env:
  SAFE_SETTINGS_CODE_DIR: ".safe-settings-code"
  # Pinned to v2.1.18 — last version compatible with Probot v13.
  # Upstream bugs blocking upgrade:
  #   - github-community-projects/safe-settings#955 (Probot v14 null logger)
  #   - github-community-projects/safe-settings#818 (check_suite crash)
  # See TODO(safe-settings-818) in the sync step.
  SAFE_SETTINGS_DEFAULT_VERSION: "594f3c706de6c4ddafb1a86dfa7468f19337e54f"

jobs:
  sync:
    if: github.repository_owner == 'complytime'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout complytime/.github repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate safe-settings YAML syntax
        run: yamllint safe-settings/

      - name: Build repo list
        id: repos
        env:
          INPUT_REPOS: ${{ inputs.repos }}
        run: |
          if [ -n "$INPUT_REPOS" ]; then
            # Manual dispatch with explicit repos
            REPO_LIST=$(echo "$INPUT_REPOS" | tr ',' '\n' | xargs -n1 | tr '\n' ' ')
          else
            # Scheduled or unscoped: read from deployment-settings.yml
            REPO_LIST=$(yq -r '.restrictedRepos.include[]' \
              safe-settings/deployment-settings.yml | tr '\n' ' ')
          fi
          echo "list=$REPO_LIST" >> "$GITHUB_OUTPUT"
          echo "Repos to sync: $REPO_LIST"

      - name: Checkout safe-settings code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: github/safe-settings
          ref: ${{ inputs.version || env.SAFE_SETTINGS_DEFAULT_VERSION }}
          path: ${{ env.SAFE_SETTINGS_CODE_DIR }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'

      - name: Install safe-settings dependencies
        working-directory: ${{ env.SAFE_SETTINGS_CODE_DIR }}
        run: npm ci

      - name: Prepare patched full-sync script
        working-directory: ${{ env.SAFE_SETTINGS_CODE_DIR }}
        run: |
          # --- Workaround for upstream check_suite bug ---
          #
          # safe-settings v2.1.18 crashes in full-sync mode because
          # handleResults accesses payload.check_suite which is
          # undefined outside the webhook flow. The sync itself
          # completes; only the Check Run reporting fails.
          #
          # Upstream issue: github-community-projects/safe-settings#818
          # Upstream fix:   github-community-projects/safe-settings#1018
          #
          # TODO(safe-settings-818): Remove this patched script and
          # revert to 'npm run full-sync' once upstream PR #1018 is
          # merged and we pin to the fixed version.
          #
          # ---
          cat > full-sync-patched.js << 'ENDPATCH'
          const appFn = require('./')
          const { FULL_SYNC_NOP } = require('./lib/env')
          const { createProbot } = require('probot')

          async function performFullSync (appFn, nop) {
            const probot = createProbot()
            probot.log.info(`Starting full sync with NOP=${nop}`)
            try {
              const app = appFn(probot, {})
              const settings = await app.syncInstallation(nop)
              if (settings.errors && settings.errors.length > 0) {
                probot.log.error('Errors occurred during full sync.')
                process.exit(1)
              }
              probot.log.info('Full sync completed successfully.')
            } catch (error) {
              // Workaround: github-community-projects/safe-settings#818
              // In full-sync mode (CLI/GHA), handleResults tries to
              // access payload.check_run.check_suite which does not
              // exist outside the webhook flow. The sync completes
              // and results are logged; only the Check Run reporting
              // fails. Safe to skip.
              if (String(error).includes("Cannot read properties of undefined (reading 'check_suite')")) {
                probot.log.info(
                  'check_suite reporting skipped (expected in full-sync mode). ' +
                  'See: github-community-projects/safe-settings#818'
                )
                return
              }
              process.stdout.write(`Unexpected error during full sync: ${error}\n`)
              process.exit(1)
            }
          }

          performFullSync(appFn, FULL_SYNC_NOP).catch((error) => {
            console.error('Fatal error during full sync:', error)
            process.exit(1)
          })
          ENDPATCH

      - name: Run safe-settings sync
        working-directory: ${{ env.SAFE_SETTINGS_CODE_DIR }}
        env:
          APP_ID: ${{ vars.SAFE_SETTINGS_APP_ID }}
          PRIVATE_KEY: ${{ secrets.SAFE_SETTINGS_PRIVATE_KEY }}
          GH_ORG: complytime
          ADMIN_REPO: .github
          CONFIG_PATH: safe-settings
          FULL_SYNC_NOP: ${{ github.event_name == 'schedule' && 'false' || inputs.dry-run }}
          LOG_LEVEL: ${{ (github.event_name == 'schedule' || !inputs.dry-run) && 'info' || 'debug' }}
          REPO_LIST: ${{ steps.repos.outputs.list }}
          BASE_DEPLOYMENT_CONFIG: ${{ format('{0}/safe-settings/deployment-settings.yml', github.workspace) }}
        run: |
          if [ "$FULL_SYNC_NOP" = "true" ]; then
            echo "=== DRY-RUN MODE: Showing what would change ==="
          fi

          # --- Sequential per-repo sync ---
          #
          # safe-settings v2.1.18 has a concurrent processing bug where
          # the repo config object is shared across repos. When multiple
          # repos are processed in parallel, the 'name' field from the
          # first repo (alphabetically) contaminates all others, causing
          # the API to reject updates with "name already exists".
          #
          # Workaround: process one repo at a time by generating a
          # scoped deployment-settings for each repo and running the
          # sync sequentially. This avoids the shared-object mutation.
          #
          # TODO(safe-settings-name-mutation): Remove this sequential
          # loop and revert to a single 'node full-sync-patched.js'
          # call once the upstream name mutation bug is fixed.
          #
          # ---
          SUCCEEDED=0
          FAILED=0
          FAILED_REPOS=""

          for repo in $REPO_LIST; do
            echo ""
            echo "::group::Syncing $repo"

            # Generate scoped deployment-settings for this single repo.
            # Uses the same format as deployment-settings.yml: plain
            # names matched by safe-settings via glob/minimatch.
            {
              echo "# Auto-generated: scoped to repo: $repo"
              echo "restrictedRepos:"
              echo "  include:"
              echo "    - $repo"
              echo ""
              yq -r 'del(.restrictedRepos) | select(. != null)' \
                "$BASE_DEPLOYMENT_CONFIG"
            } > /tmp/scoped-deployment-settings.yml

            export DEPLOYMENT_CONFIG_FILE="/tmp/scoped-deployment-settings.yml"

            if node full-sync-patched.js; then
              echo "::endgroup::"
              echo "✓ $repo"
              SUCCEEDED=$((SUCCEEDED + 1))
            else
              echo "::endgroup::"
              echo "::error::Failed to sync $repo"
              FAILED=$((FAILED + 1))
              FAILED_REPOS="$FAILED_REPOS $repo"
            fi
          done

          echo ""
          echo "=== Summary ==="
          echo "Succeeded: $SUCCEEDED"
          echo "Failed:    $FAILED"
          if [ "$FAILED" -gt 0 ]; then
            echo "Failed repos:$FAILED_REPOS"
            exit 1
          fi
